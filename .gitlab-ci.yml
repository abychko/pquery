default:
  tags:
    - docker


workflow:
  rules:
    - when: always
      if: "$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH"
    - when: never


stages:
  - build



build:pquery:
  stage: build
  image: "ubuntu:24.04"
  before_script:
    - apt install -y build-essentials devscripts libssl-dev libmysql-dev
  script:
    - cmake -DMYSQL_FORK=MARIADB
    - cpack
    - ls -la
  # artifacts:
